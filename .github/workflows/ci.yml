# CI then CD: tests always; deploy to VPS only after tests pass on main.
# Setup guide: DEPLOYMENT.cd.md
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: # Actions → CI → Run workflow (runs tests, then deploy on main)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated PR runs; never cancel a main deploy mid-flight
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            BE/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run core.tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: python manage.py test core.tests --verbosity=2

  deploy:
    needs: test
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps
      cancel-in-progress: false

    steps:
      - name: Check deploy secrets are set
        run: |
          missing=0
          [ -n "${{ secrets.VPS_HOST }}" ] || { echo "VPS_HOST is empty"; missing=1; }
          [ -n "${{ secrets.VPS_USER }}" ] || { echo "VPS_USER is empty"; missing=1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "VPS_SSH_KEY is empty"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings → Secrets → Actions"
            exit 1
          fi
          echo "All deploy secrets are present (values not printed)."

      - name: SSH connectivity probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 2m
          debug: true
          script: |
            set -euxo pipefail
            echo "SSH_OK hostname=$(hostname) user=$(whoami) pwd=$(pwd)"
            test -d /opt/kleio
            echo "DIR_OK /opt/kleio exists"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          debug: true
          script: |
            set -euxo pipefail
            echo "==> Connected to $(hostname) as $(whoami)"
            cd /opt/kleio
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x scripts/deploy.sh scripts/smoke-check.sh
            bash scripts/deploy.sh
