# Continuous deploy: push to main → SSH to Hetzner → pull + docker compose.
# Setup guide: DEPLOYMENT.cd.md
name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual "Run workflow" from GitHub Actions UI

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/kleio
            if [ -x ./scripts/deploy.sh ]; then
              ./scripts/deploy.sh
            else
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
              docker compose up --build -d
              ./scripts/smoke-check.sh
            fi
